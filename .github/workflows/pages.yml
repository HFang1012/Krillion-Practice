name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  # Pull new dives into the dictionary automatically, every 3 hours.
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

# Separate from the built-in "pages" group. That workflow publishes the
# repository source with Jekyll and was replacing this compiled site.
concurrency:
  group: pages-vite
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh the answer bank
        run: npm run bank
      - name: Commit new questions
        run: |
          if [ -n "$(git status --porcelain public/bank)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898+github-actions[bot]@users.noreply.github.com"
            git add public/bank
            git commit -m "Update answer bank through $(node -p "require('./public/bank/index.json').through")"
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Answer bank already current."
          fi
      - name: Build
        run: npm run build
        env:
          # A user site (username.github.io) is served from /. Every other repo is served from /<repo>/.
          BASE_PATH: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}/', github.event.repository.name) }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages is still set to publish the branch. That Jekyll run deploys the
      # Vite source (index.html loads /src/main.tsx) and was finishing last,
      # so the live site stayed blank. Wait for it, then deploy dist over it.
      - name: Wait for the branch Pages publish
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const sha = context.sha
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))

            let buildType = 'unknown'
            try {
              const site = await github.rest.repos.getPages({ owner, repo })
              buildType = site.data.build_type || 'unknown'
            } catch (error) {
              core.info(`Pages lookup skipped (${error.status || error.message}).`)
            }
            if (buildType === 'workflow') {
              core.info('Pages source is GitHub Actions. Deploying now.')
              return
            }

            const { data } = await github.rest.actions.listRepoWorkflows({ owner, repo, per_page: 100 })
            const branchWorkflow = data.workflows.find((item) => item.path === 'dynamic/pages/pages-build-deployment')
            if (!branchWorkflow) {
              core.info('No branch Pages workflow. Deploying now.')
              return
            }

            const started = Date.now()
            let sawRun = false
            while (Date.now() - started < 4 * 60 * 1000) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: branchWorkflow.id,
                head_sha: sha,
                per_page: 5,
              })
              const run = runs.data.workflow_runs.find((item) => item.head_sha === sha)
              if (run) {
                sawRun = true
                core.info(`Branch Pages build is ${run.status}.`)
                if (run.status === 'completed') return
              } else if (!sawRun && Date.now() - started > 45 * 1000) {
                core.info('Branch Pages build did not start. Deploying now.')
                return
              }
              await sleep(5000)
            }
            core.warning('Branch Pages build did not finish in time. Deploying the compiled site anyway.')
      - id: deployment
        uses: actions/deploy-pages@v4
