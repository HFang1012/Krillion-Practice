<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050a14" />
    <meta
      name="description"
      content="Unofficial Krillion practice. Learn the rare answers, then get rated the same way the dive does."
    />
    <title>Krillion Practice</title>
    <link rel="icon" href="%BASE_URL%art/krillion.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      The branch Pages publisher serves this file unchanged, so /src/main.tsx
      never runs. Vite dev and the compiled deploy skip this and use the entry above.
    -->
    <script>
      ;(function () {
        if (document.querySelector('script[src*="@vite/client"], script[src*="/assets/index-"]')) return
        var path = location.pathname
        var dir = path.endsWith('/') ? path : path.replace(/\/[^/]*$/, '/')
        var base = location.origin + dir
        var link = document.createElement('link')
        link.rel = 'stylesheet'
        link.href = base + 'public/assets/app.css'
        document.head.appendChild(link)
        var script = document.createElement('script')
        script.type = 'module'
        script.src = base + 'public/assets/app.js'
        document.body.appendChild(script)
      })()
    </script>
  </body>
</html>
